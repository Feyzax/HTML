<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google! Beta</title>
    <link rel="stylesheet" href="google.css">
</head>
<body>

    <div class="container">

        <img src="https://web.archive.org/web/19990504112211im_/http://www.google.com/google.jpg"
             alt="Google Beta" class="logo">

        <p class="subtitle">Search the web using Google!</p>

        <form>
            <input type="text" class="search-box"><br>
            <button>Google Search</button>
            <button>I'm feeling lucky</button>
        </form>

        <div class="boxes">

            <div class="box light">
                <b>Special Searches</b><br>
                <a href="#">Stanford Search</a><br>
                <a href="#">Linux Search</a>
            </div>

            <div class="box medium">
                <a href="#">Help!</a><br>
                <a href="#">About Google!</a><br>
                <a href="#">Company Info</a><br>
                <a href="#">Google! Logos</a>
            </div>

            <div class="box dark">
                <b>Get Google!</b><br>
                updates monthly:<br>
                <input type="email" placeholder="your e-mail"><br>
                <button>Subscribe</button><br>
                <a href="#">Archive</a>
            </div>

        </div>

        <p class="footer">Copyright ©1998 Google Inc.</p>

    </div>

</body>
</html>
